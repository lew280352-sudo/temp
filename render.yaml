services:
  - type: web
    name: stocklens
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: REQUIRE_REMOTE_DATABASE
        value: "true"
      - key: HOSTING_PROFILE
        value: render-free
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: EMAIL_LOGIN_OTP_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: auto
      - key: NEWS_ENABLED
        value: "true"
